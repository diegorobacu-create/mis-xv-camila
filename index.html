<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mis XV Camila</title>
  <meta name="description" content="Invitacion a los XV de Camila.">
  <style>
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: #ffffff; }
    body {
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 0;
      font-family: Arial, Helvetica, sans-serif;
    }
    .card {
      position: relative;
      width: min(100vw, 595.5px);
      aspect-ratio: 595.5 / 842.25;
      background: #fff;
    }
    .card img {
      display: block;
      width: 100%;
      height: 100%;
      object-fit: contain;
    }
    .hotspot {
      position: absolute;
      display: block;
      border-radius: 999px;
      -webkit-tap-highlight-color: rgba(255,255,255,.28);
    }
    .hotspot:focus-visible {
      outline: 3px solid rgba(255,255,255,.98);
      outline-offset: 4px;
      box-shadow: 0 0 0 6px rgba(224, 91, 159, .65);
    }
    .sr-only {
      position: absolute;
      width: 1px;
      height: 1px;
      padding: 0;
      margin: -1px;
      overflow: hidden;
      clip: rect(0,0,0,0);
      white-space: nowrap;
      border: 0;
    }
    @media (min-aspect-ratio: 595.5 / 842.25) {
      .card { width: auto; height: 100vh; }
    }
  </style>
</head>
<body>
  <main class="card" aria-label="Invitacion a los XV de Camila">
    <img src="camila.jpg" alt="Invitacion a los XV de Camila">
      <a class="hotspot" href="https://maps.app.goo.gl/PiG9Faqx7xKt4PbU9?g_st=aw" target="_blank" rel="noopener" aria-label="Ver ubicacion" title="Ver ubicacion" style="left:23.725743%;top:49.253986%;width:8.315483%;height:8.017275%"></a>
      <a class="hotspot" href="https://w.app/pwx0nu" target="_blank" rel="noopener" aria-label="Confirmar asistencia" title="Confirmar asistencia" style="left:35.279110%;top:64.720190%;width:29.482133%;height:4.275880%"></a>
      <a class="hotspot" href="https://canva.link/dew7cqsgqlkywnv" target="_blank" rel="noopener" aria-label="Lista de regalos" title="Lista de regalos" style="left:44.487993%;top:74.722719%;width:11.087305%;height:7.839110%"></a>
  </main>
  <p class="sr-only">Enlaces: ubicacion, confirmar asistencia y lista de regalos.</p>
</body>
</html>
